<div class="message" [class.user-message]="message.sender === 'user'" [class.ai-message]="message.sender === 'ai'"><div class="message-avatar" aria-hidden="true">{{ message.sender === 'user' ? 'U' : 'AI' }}</div><div class="message-content"><div class="message-meta"><span>{{ message.sender === 'user' ? 'You' : 'AI assistant' }}</span><time>{{ message.timestamp | date:'shortTime' }}</time></div><div class="message-bubble" [class.sending]="message.status === 'sending'" [class.error]="message.status === 'error'">{{ message.content }}</div>@if (message.status === 'error') { <span class="message-error">Not sent — please try again.</span> }</div></div>
