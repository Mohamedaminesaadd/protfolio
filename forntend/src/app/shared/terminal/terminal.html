<div class="terminal-window">

  <!-- Terminal header -->
  <div class="terminal-header">

    <div class="terminal-dots">

      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>

    </div>

    <span class="terminal-title">
      ~/portfolio - bash
    </span>

  </div>


  <!-- Terminal body -->
  <div class="terminal-body">

    <!-- AI badge -->
    <div class="hero-chip">

      <span class="chip-icon">
        ✦
      </span>

      <span>
        Artificial Intelligence
      </span>

    </div>


    <!-- WHOAMI -->
    <div class="code-line">

      <span class="prompt">
        $
      </span>

      <span class="command">
        whoami
      </span>

    </div>

    <div class="code-line output">

      <span class="typing-text name-text">

        {{ name }}<span class="typing-cursor"></span>

      </span>

    </div>


    <!-- ROLE -->
    <div class="code-line">

      <span class="prompt">
        $
      </span>

      <span class="command">
        cat role.txt
      </span>

    </div>

    <div class="code-line output">

      <span class="typing-text">

        {{ role }}<span class="typing-cursor"></span>

      </span>

    </div>


    <!-- PASSION -->
    <div class="code-line">

      <span class="prompt">
        $
      </span>

      <span class="command">
        echo $PASSION
      </span>

    </div>

    <div class="code-line output">

      <span class="typing-text">

        {{ passion }}<span class="typing-cursor"></span>

      </span>

    </div>


    <!-- LOCATION -->
    <div class="code-line">

      <span class="prompt">
        $
      </span>

      <span class="command">
        pwd
      </span>

    </div>

    <div class="code-line output">

      <span class="typing-text location-text">
        Tunisia
      </span>

    </div>


    <!-- FINAL PROMPT -->
    <div class="code-line final-prompt">

      <span class="prompt">
        $
      </span>

      <span class="command">
        ready_to_build<span class="terminal-cursor">_</span>
      </span>

    </div>

  </div>

</div>
